name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test and package Windows x64
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          ./scripts/package-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            dist/AgentAim-Windows-x64-*.zip
            dist/AgentAim-Windows-x64-*.zip.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test and package macOS
        run: |
          swift test
          ./scripts/package.sh
          version="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent dist/AgentAim.app "dist/AgentAim-macOS-$version.zip"
          shasum -a 256 "dist/AgentAim-macOS-$version.zip" | sed 's#dist/##' > "dist/AgentAim-macOS-$version.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            dist/AgentAim-macOS-*.zip
            dist/AgentAim-macOS-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true
      - name: Publish unsigned preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AgentAim $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease \
            --notes "Unsigned preview build. Windows may show SmartScreen and macOS may show Gatekeeper warnings. Verify the attached SHA-256 files before installation."
