name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test and package Windows x64
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          ./scripts/package-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            dist/AgentAim-Windows-x64-*.zip
            dist/AgentAim-Windows-x64-*.zip.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test and package macOS
        run: |
          swift test
          version="${GITHUB_REF_NAME#v}"
          marketing_version="${version%%-*}"
          AGENTAIM_VERSION="$marketing_version" AGENTAIM_BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/package.sh
          ditto -c -k --sequesterRsrc --keepParent dist/AgentAim.app "dist/AgentAim-macOS-$version.zip"
          shasum -a 256 "dist/AgentAim-macOS-$version.zip" | sed 's#dist/##' > "dist/AgentAim-macOS-$version.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            dist/AgentAim-macOS-*.zip
            dist/AgentAim-macOS-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true
      - name: Verify release channel
        run: |
          channel="stable"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            channel="preview"
          fi
          test -f "release-channels/$channel"
          test "$(tr -d '\r\n' < "release-channels/$channel")" = "$GITHUB_REF_NAME"
      - name: Publish unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          release_note="Unsigned release build. Windows may show SmartScreen and macOS may show Gatekeeper warnings. Verify the attached SHA-256 files before installation."
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag+=(--prerelease)
            release_note="Unsigned preview build. Windows may show SmartScreen and macOS may show Gatekeeper warnings. Verify the attached SHA-256 files before installation."
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AgentAim $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease_flag[@]}" \
            --notes "$release_note"
