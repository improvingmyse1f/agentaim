name: Feature request
description: 提议一个具体、可验证的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述场景和阻碍，不要只写功能名称。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 什么可观察结果代表问题已经解决？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方法
  - type: checkboxes
    id: boundaries
    attributes:
      label: 产品边界
      options:
        - label: 该提议不要求默认自动开局或登录启动。
          required: true
        - label: 该提议不要求读取游戏画面或提供瞄准辅助。
          required: true
